[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-ad-account-analysis"
version = "1.0.0"
description = "An anonymized manga advertising account performance diagnostics portfolio project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.24,<3.0",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<1.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "nbformat>=5.9,<6",
  "nbclient>=0.9,<1",
  "jupyter>=1,<2",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
